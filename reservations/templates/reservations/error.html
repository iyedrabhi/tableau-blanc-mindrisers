{% extends "base.html" %}
{% block content %}
<style>
  body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #fff8f0;
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
  }

  h1 {
      color: #e74c3c;
      font-size: 3em;
      margin-bottom: 10px;
      text-align: center;
  }

  p {
      font-size: 1.2em;
      margin-bottom: 20px;
      text-align: center;
      color: #7f8c8d;
  }

  a.button {
      display: inline-block;
      padding: 12px 25px;
      background-color: #e67e22;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
  }

  a.button:hover {
      background-color: #d35400;
      transform: translateY(-3px);
  }
</style>

<h1>Oups !</h1>
<p>{{ message }}</p>
<a href="{% url 'my_reservations' %}" class="button">Retour à mes réservations</a>
{% endblock %}
