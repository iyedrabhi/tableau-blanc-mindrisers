<!-- templates/base.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=0">
    <title>{% block title %}Restaurant Management System{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    {% block extra_css %}{% endblock %}
</head>

<body>
    <!-- Navigation (if needed for dashboard) -->
    <nav class="navbar navbar-default navbar-fixed-top">
        <div class="container-fluid">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#main-navbar" aria-expanded="false">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="{% url 'gerant_dashboard' %}">
                    <img src="{% static 'images/logo.png' %}" alt="Logo" height="40" style="display: inline-block; margin-right: 10px;">
                    Restaurant Management
                </a>
            </div>
            <div class="collapse navbar-collapse" id="main-navbar">
                <ul class="nav navbar-nav navbar-right">
                    <li><a href="{% url 'gerant_dashboard' %}"><i class="fa fa-dashboard"></i> Dashboard</a></li>
                    <li><a href="{% url 'clients_list' %}"><i class="fa fa-users"></i> Clients</a></li>
                    <li><a href="{% url 'livreurs_list' %}"><i class="fa fa-motorcycle"></i> Livreurs</a></li>
                    <li><a href="http://127.0.0.1:8000/"><i class="fa fa-cutlery"></i> Menu</a></li>
                    <li>
                        <a href="{% url 'logout' %}" style="background: #e67e22; color: white; border-radius: 5px; padding: 10px 20px; margin-left: 10px;">
                            <i class="fa fa-sign-out"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>

    <!-- JavaScript Files -->
    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/modernizer.js' %}"></script>
    <script src="{% static 'js/custom.js' %}"></script>
    
    {% block extra_js %}{% endblock %}
</body>

</html>
